name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: credroute
          POSTGRES_PASSWORD: credroute
          POSTGRES_DB: credroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: npm test
      - run: npm run build
      - run: pytest backend/tests -q --ignore=backend/tests/load --cov=app --cov-report=term-missing
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg2://credroute:credroute@127.0.0.1:5432/credroute
          PYTHONPATH: backend
          JWT_SECRET: ci-test-jwt-secret-not-for-production-use
          PAN_HMAC_SECRET: ci-test-pan-hmac-secret-not-for-production
          REDIS_URL: redis://127.0.0.1:6379/0
      - run: python3 backend/benchmarks/run_proof.py --mode quick
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg2://credroute:credroute@127.0.0.1:5432/credroute
          PYTHONPATH: backend
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET: ci-test-jwt-secret-not-for-production-use
          PAN_HMAC_SECRET: ci-test-pan-hmac-secret-not-for-production
