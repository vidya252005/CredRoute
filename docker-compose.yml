# Local development stack only. Do not treat committed defaults as deploy secrets.
# Host-published DB/Redis ports are for local tooling; keep them off a public VPS.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credroute}
      POSTGRES_DB: ${POSTGRES_DB:-credroute}
    ports:
      - "5432:5432"
    volumes:
      - credroute-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credroute} -d ${POSTGRES_DB:-credroute}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-credroute}:${POSTGRES_PASSWORD:-credroute}@postgres:5432/${POSTGRES_DB:-credroute}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-}
      PAN_HMAC_SECRET: ${PAN_HMAC_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml:/app/ml

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.tasks.celery_app worker -l info -Q lender_evaluation_queue
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-credroute}:${POSTGRES_PASSWORD:-credroute}@postgres:5432/${POSTGRES_DB:-credroute}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-}
      PAN_HMAC_SECRET: ${PAN_HMAC_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  mongodb:
    image: mongo:8
    restart: unless-stopped
    profiles: ["legacy"]
    ports:
      - "27017:27017"
    volumes:
      - credroute-mongo:/data/db

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - credroute-grafana:/var/lib/grafana

volumes:
  credroute-postgres:
  credroute-mongo:
  credroute-grafana:
